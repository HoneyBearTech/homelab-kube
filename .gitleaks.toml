# gitleaks' default rules, plus one exception: the encrypted values of SealedSecrets (docs/sealed-secrets.md).
# They look like keys to generic-api-key ("..._PASSWORD: <long string>") but only the cluster's controller can
# decrypt them. Only a whole line of the form "KEY: Ag<300+ base64 characters>", the shape kubeseal writes, is
# exempt; a plain value is still reported wherever it is.
[extend]
useDefault = true

[[allowlists]]
description = "Sealed Secrets ciphertext"
regexTarget = "line"
regexes = ['''^\s+[A-Z][A-Z0-9_]*: Ag[A-Za-z0-9+/]{300,}={0,2}$''']
