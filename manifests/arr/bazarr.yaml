# Bazarr: the same image as on the Compose host. Its config folder is on Longhorn; its database is on the
# PostgreSQL server (a copy while a shadow, the production one once live). The media is at /media, as there. Served by
# Traefik under /bazarr-k8s (the base URL is set in its config.yaml). 0 replicas until its config is loaded
# (docs/arr.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: arr
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: arr
  labels:
    app.kubernetes.io/name: bazarr
spec:
  # Never more than 1: the config volume is ReadWriteOnce, and two instances must never share one database.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr
        # shadow: read-only, on a copy of its databases; live: the Compose host's copy is stopped (docs/arr.md#modes).
        homelab-kube/mode: shadow
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:version-v1.6.2@sha256:fb0437897eaa7f96cf6ac42f795f8dcc208d34ec969eac5d366454e767304eb9
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: Etc/UTC}
            - {name: UMASK, value: "002"}
          ports:
            - {name: http, containerPort: 6767}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /media, readOnly: true}
          # TCP, not HTTP: a copied config's Allowed Hosts answers 400 to the kubelet's Host header.
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: bazarr-config}
        - name: media
          persistentVolumeClaim: {claimName: media-ro, readOnly: true}
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: arr
spec:
  selector:
    app.kubernetes.io/name: bazarr
  ports:
    - {name: http, port: 6767, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazarr
  namespace: arr
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /bazarr-k8s
            pathType: Prefix
            backend:
              service:
                name: bazarr
                port: {name: http}
