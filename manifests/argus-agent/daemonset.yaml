# One Argus agent per node, servers included: the agent image's Kubernetes configuration (kubernetes.alloy).
# It reports as the node's name; endpoints and password come from the hand-made Secret argus/argus-agent.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: argus-agent
  namespace: argus
  labels:
    app.kubernetes.io/name: argus-agent
  annotations:
    homelab-kube/allow-no-privileged: >-
      Host network and PID, as the agent has on every Docker host: node_exporter reads the node's network
      interfaces from /proc/net and its filesystems from PID 1's mount table. Not privileged, no container runtime
      socket; the node's / and /sys are mounted read-only. Approved by the owner 2026-10-29.
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-agent
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-agent
    spec:
      serviceAccountName: argus-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      # Every node, including the servers' CriticalAddonsOnly taint and a node that is going down.
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/honeybeartech/argus-agent:0.9.0@sha256:a538a3a8d5610fdafdab7eefb8ab7856b8ce5be7c6553c9d9c7ed51afc0dac2e
          args:
            - run
            - /etc/alloy/kubernetes.alloy
            - --storage.path=/var/lib/alloy/data
            # The pod shares the node's network: keep Alloy's UI off the LAN.
            - --server.http.listen-addr=127.0.0.1:12345
          env:
            - name: ARGUS_HOST
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ARGUS_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          envFrom:
            - secretRef:
                name: argus-agent
          # Root with no capability but DAC_OVERRIDE: pod log files are root's, mode 0640. Every host mount is
          # read-only, so it can read them, not change them.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [DAC_OVERRIDE]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: rootfs, mountPath: /rootfs, readOnly: true, mountPropagation: HostToContainer}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: data, mountPath: /var/lib/alloy/data}
      volumes:
        - name: rootfs
          hostPath: {path: /}
        - name: sys
          hostPath: {path: /sys}
        # Alloy's write-ahead log and log positions only. A replaced pod re-reads at most the last hour of each log
        # file, and Loki ignores lines it already has.
        - name: data
          emptyDir: {}
