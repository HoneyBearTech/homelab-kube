# Sonarr for the trial: the same image as the Compose stack, its config on Longhorn (copied in from the Compose
# stack, docs/media-trial.md), the media read-only at the same path (/media), served by Traefik under /sonarr-k8s.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media-trial
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media-trial
  labels:
    app.kubernetes.io/name: sonarr
spec:
  # 1, now that the config is copied in (docs/media-trial.md). Never more: the config volume is ReadWriteOnce
  # and the app's SQLite database allows one writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:version-4.0.20.3014@sha256:0deb8db6c839ac475e9cd86277712772c40ba7f929a003d7e1de36c4b666bc13
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: Etc/UTC}
            - {name: UMASK, value: "002"}
            - {name: SONARR__SERVER__URLBASE, value: /sonarr-k8s}
          ports:
            - {name: http, containerPort: 8989}
          # As in the Compose stack: every capability dropped except what the image's init needs to switch user.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /media, readOnly: true}
          startupProbe:
            httpGet: {path: /sonarr-k8s/ping, port: http}
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /sonarr-k8s/ping, port: http}
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: sonarr-config}
        - name: media
          persistentVolumeClaim: {claimName: media, readOnly: true}
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media-trial
spec:
  selector:
    app.kubernetes.io/name: sonarr
  ports:
    - {name: http, port: 8989, targetPort: http}
---
# No host: any name or address that reaches Traefik works, so nothing site-specific is committed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media-trial
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /sonarr-k8s
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port: {name: http}
