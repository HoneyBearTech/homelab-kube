# Radarr for the trial: the same image as the Compose stack, its config on Longhorn (copied in from the Compose
# stack, docs/media-trial.md), the media read-only at the same path (/media), served by Traefik under /radarr-k8s.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: media-trial
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media-trial
  labels:
    app.kubernetes.io/name: radarr
spec:
  # 1, now that the config is copied in (docs/media-trial.md). Never more: the config volume is ReadWriteOnce
  # and the app's SQLite database allows one writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:version-6.4.4.10685@sha256:cfbc4fa09dc9d78f7cedc898f4ec48c6277cacedc523c4e159db6ff1c741959c
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: Etc/UTC}
            - {name: UMASK, value: "002"}
            - {name: RADARR__SERVER__URLBASE, value: /radarr-k8s}
          ports:
            - {name: http, containerPort: 7878}
          # As in the Compose stack: every capability dropped except what the image's init needs to switch user.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /media, readOnly: true}
          # TCP, not HTTP: the copied config's Allowed Hosts answers 400 to any Host header it doesn't list, such as
          # the pod's own address the kubelet would send.
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: radarr-config}
        - name: media
          persistentVolumeClaim: {claimName: media, readOnly: true}
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media-trial
spec:
  selector:
    app.kubernetes.io/name: radarr
  ports:
    - {name: http, port: 7878, targetPort: http}
---
# No host: any name or address that reaches Traefik works, so nothing site-specific is committed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: media-trial
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /radarr-k8s
            pathType: Prefix
            backend:
              service:
                name: radarr
                port: {name: http}
