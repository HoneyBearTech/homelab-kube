# Argo CD itself, from its Helm chart: the release first installed by hand (docs/installing.md#argo-cd), adopted
# so that upgrades are pull requests too. The values must match that install, or the first sync changes it.
# Not pruned automatically: a bad change here can't delete Argo CD; self-heal still reverts manual edits.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.11.6
    helm:
      # The Helm release's name: the chart names every object after it (argocd-server, argocd-repo-server, ...).
      releaseName: argocd
      valuesObject:
        server:
          service:
            type: LoadBalancer
        dex:
          enabled: false
        configs:
          rbac:
            # Single sign-on (docs/sso.md): users are matched by their email; anyone not in policy.csv gets nothing.
            scopes: "[email]"
            policy.default: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Single sign-on is site-specific (the URL holds the domain, policy.csv an email), so it is set on the cluster by
  # hand (docs/sso.md) and these fields are left alone.
  ignoreDifferences:
    - kind: ConfigMap
      name: argocd-cm
      jsonPointers:
        - /data/url
        - /data/oidc.config
    - kind: ConfigMap
      name: argocd-rbac-cm
      jsonPointers:
        - /data/policy.csv
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # Argo CD's CRDs are too large for client-side apply; server-side apply also leaves alone the fields the chart
      # doesn't set, such as the admin password in argocd-secret.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
