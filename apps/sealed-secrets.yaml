# Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets), from its Helm chart: Secrets are committed
# encrypted, as SealedSecret objects that only the controller in this cluster can decrypt (docs/sealed-secrets.md).
# Named and placed as kubeseal expects by default (sealed-secrets-controller in kube-system), so it needs no flags.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets-controller
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        # One sealing key, never renewed: the copy in the owner's password manager stays enough to restore every
        # SealedSecret after a rebuild. Rotating is a deliberate step (docs/sealed-secrets.md#rotating-the-key).
        keyrenewperiod: "0"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
