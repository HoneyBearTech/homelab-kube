# The *arr apps on the cluster, beside the Compose host that runs them today (manifests/arr/). Each runs first as a
# read-only shadow on a copy of its databases, then moves live one app at a time while the Compose host's copy is
# stopped (docs/arr.md). The apps start at 0 replicas: their configs are loaded first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HoneyBearTech/homelab-kube.git
    targetRevision: main
    path: manifests/arr
  destination:
    server: https://kubernetes.default.svc
    namespace: arr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
